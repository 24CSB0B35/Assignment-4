<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking - Hyderabad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: url('Screenshot 2025-02-15 223917.png') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        h1 {
            color: white;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        form {
            width: 40%;
            margin: auto;
            background: rgba(255, 255, 255, 0.1); /* Fully transparent background */
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px); /* Blurred glass effect */
        }

        label {
            font-weight: bold;
            display: block;
            margin: 10px 0 5px;
            text-align: left;
            color: white;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 5px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        button {
            background: #ffcc00;
            color: black;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }

        button:hover {
            background: #ff9900;
        }

        @media (max-width: 768px) {
            form {
                width: 80%;
            }
        }
    </style>
</head>
<body>

<h1>Book Your Stay in Hyderabad</h1>

<form>
    <label>Name:</label>
    <input type="text" name="name" placeholder="Enter your full name" required>
    
    <label>Email:</label>
    <input type="email" name="email" placeholder="Enter your email" required>
    
    <label>Check-in Date:</label>
    <input type="date" name="checkin" required>
    
    <label>Check-out Date:</label>
    <input type="date" name="checkout" required>
    
    <label>Room Type:</label>
    <select name="room">
        <option>Standard</option>
        <option>Deluxe</option>
        <option>Suite</option>
    </select>
    
    <label>Special Requests:</label>
    <textarea name="requests" rows="4" placeholder="Any special requests (optional)"></textarea>
    
    <button type="submit">Book Now</button>
</form>

</body>
</html>
