<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Hyderabad Heritage</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
        }

        h1 {
            color: #800000;
            margin-bottom: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            justify-content: center;
            max-width: 1000px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            object-fit: cover;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

<h1>Hyderabad Heritage Gallery</h1>
<div class="gallery">
    <img src="charminar.png" alt="Charminar">
    <img src="golcondafort.png" alt="Golconda Fort">
    <img src="tombs.png" alt="Qutub Shahi Tombs">
    <img src="chowmalla.png" alt="Chowmahalla Palace">
    <img src="falaknumapalace.png" alt="Falaknuma Palace">
    <img src="nightlife.png" alt="Night Life">
</div>

</body>
</html>
